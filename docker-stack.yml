version: '3.8'

secrets:
  db_password:
    external: true

configs:
  nginx_conf:
    file: ./nginx.conf

volumes:
  postgres_swarm_data:
  keys_volume:

networks:
  market_net:
    driver: overlay

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: market_rubik_db
      POSTGRES_USER: cruduser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_swarm_data:/var/lib/postgresql/data
    secrets:
      - db_password
    networks:
      - market_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cruduser -d market_rubik_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@marketrubik.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "5051:80"
    secrets:
      - db_password
    networks:
      - market_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  ai:
    image: market_rubik_ai:latest
    networks:
      - market_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    image: alpine:latest
    command: ["sh", "-c", "echo 'Trabajador de correo simulado iniciado'; while true; do sleep 3600; done"]
    networks:
      - market_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  web:
    image: market_rubik_web:latest
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=market_rubik_db;Username=cruduser;Password=PASSWORD_PLACEHOLDER
      - AIService__Url=http://ai:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - Bootstrap__AdminPassword=${MARKET_ADMIN_PASSWORD:-}
      - ASPNETCORE_URLS=http://+:8080
      - Ollama__Url=http://host.docker.internal:11434
      - Ollama__Model=qwen2.5:0.5b
      # Google OAuth
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      # Email SMTP
      - EmailSettings__SenderName=Supermarket Rubik
      - EmailSettings__SenderEmail=${SMTP_EMAIL:-}
      - EmailSettings__SmtpServer=smtp.gmail.com
      - EmailSettings__SmtpPort=587
      - EmailSettings__Password=${SMTP_PASSWORD:-}
      # PayPal Sandbox
      - PayPal__ClientId=${PAYPAL_CLIENT_ID:-}
      - PayPal__ClientSecret=${PAYPAL_CLIENT_SECRET:-}
      - PayPal__BaseUrl=https://api-m.sandbox.paypal.com
      - PayPal__ReturnUrl=http://localhost:8080/Payment/Success
      - PayPal__CancelUrl=http://localhost:8080/Payment/Cancel
      # PayPhone
      - PayPhone__Token=${PAYPHONE_TOKEN:-}
      - PayPhone__StoreId=${PAYPHONE_STORE_ID:-}
    secrets:
      - db_password
    ports:
      - "9090:8080"
    volumes:
      - keys_volume:/app/keys
    networks:
      - market_net
    deploy:
      replicas: 3
      restart_policy:
        condition: any


